name: Publish phone sandbox

on:
  push:
    branches: [main]
    paths:
      - hq-base/hexagon-race-4/sandbox/index.html
      - hq-base/hexagon-race-4/sandbox/style.css
      - hq-base/hexagon-race-4/sandbox/app.js
      - hq-base/hexagon-race-4/sandbox/data.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload sandbox
        uses: actions/upload-pages-artifact@v3
        with:
          path: hq-base/hexagon-race-4/sandbox
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
