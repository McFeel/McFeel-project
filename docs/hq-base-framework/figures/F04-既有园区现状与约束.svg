   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: middle; fill: #174a72" x="265.68" y="152.084722" transform="rotate(-0 265.68 152.084722)">广州科学城 · 持续运行的既有园区</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: middle; fill: #087a58" x="265.68" y="311.411688" transform="rotate(-0 265.68 311.411688)">不停机 · 不大拆 · 先测后改</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #0068b7" x="80.8704" y="145.114558" transform="rotate(-0 80.8704 145.114558)">持续办公</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(80.8704 158.440191)">约 5000 人</text>
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(80.8704 169.168691)">不可成片停机</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #13a7a0" x="358.0848" y="145.162136" transform="rotate(-0 358.0848 145.162136)">设备年限</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(358.0848 158.427426)">主要设备 2016 年投运</text>
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(358.0848 169.173394)">未到报废年限</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #e59b22" x="76.8528" y="230.296648" transform="rotate(-0 76.8528 230.296648)">历史风貌</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(76.8528 243.591328)">外立面不可大改</text>
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(76.8528 254.329234)">采用针灸式更新</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #00a86b" x="366.12" y="233.807894" transform="rotate(-0 366.12 233.807894)">光伏边界</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(366.12 247.148222)">屋顶空间有限</text>
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(366.12 257.872691)">现状约 2 点几 MW</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #174a72" x="217.4688" y="336.715198" transform="rotate(-0 217.4688 336.715198)">用电口径</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(217.4688 350.028066)">年用电约 7000 万度</text>
    <text style="font-size: 8.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; fill: #20303c" transform="translate(217.4688 360.791503)">机房是否计入待核</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: middle; fill: #20303c" x="265.68" y="380.648112" transform="rotate(-0 265.68 380.648112)">不停机 → 园中园试点　｜　风貌受限 → 针灸式更新　｜　设备未报废 → 不换主机先节能</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.6px; font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Micro Hei', sans-serif; text-anchor: start; fill: #5f6f7a" x="74.844" y="401.085399" transform="rotate(-0 74.844 401.085399)">以上数字均为【交流纪要／会中口述，待核实】：未经核证，量级参照。</text>
